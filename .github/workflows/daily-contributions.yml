name: Daily GitHub Contributions Booster

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  make-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Author as Eng-Ahmed-Rifai
        run: |
          git config --global user.name "Eng-Ahmed-Rifai"
          git config --global user.email "110114267+Eng-Ahmed-Rifai@users.noreply.github.com"

      - name: Run Contribution Generator
        run: |
          node commit.js --min=12 --max=50

      - name: Push Commits to GitHub
        run: |
          git push origin main
